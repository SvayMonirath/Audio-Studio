name: Audio Studio CI

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

# Restrict permissions to least privilege (security hardening)
permissions:
  contents: read

# Cancel in-progress runs for the same branch to save runner minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Enforce Zero External Python Dependencies Invariant
        run: |
          echo "Verifying zero third-party Python dependency invariant..."
          if [ -f requirements.txt ] || [ -f Pipfile ] || [ -f pyproject.toml ]; then
            echo "ERROR: Third-party dependency manifests detected. Audio Studio backend must run purely on Python standard library."
            exit 1
          fi
          echo "Invariant verified: Pure standard library repository."

      - name: Verify Python Syntax Compilation
        run: |
          python3 -m compileall -q run_server.py database.py scripts/ tests/

      - name: Run Automated Test Suite
        run: |
          python3 -m unittest discover -s tests -v

      - name: Validate Package Integrity
        run: |
          python3 scripts/validate_package.py
